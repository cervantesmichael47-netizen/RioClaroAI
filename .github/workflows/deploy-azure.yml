name: Deploy existing Azure App Service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rioclaro-ai-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Prepare production package
        run: |
          npm prune --omit=dev
          zip -qr app.zip server public server.js package.json package-lock.json node_modules

      - name: Deploy to existing App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: rioclaro-ai-mgrc
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

      - name: Verify public demo and Foundry connectivity
        env:
          APP_URL: https://rioclaro-ai-mgrc-febegnb5ctajgbcx.westus-01.azurewebsites.net
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const baseUrl = process.env.APP_URL;
          const delay = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          const getJson = async (path) => {
            const response = await fetch(new URL(path, baseUrl));
            assert.equal(response.status, 200, `${path} should respond with HTTP 200.`);
            return response.json();
          };

          let health;
          for (let attempt = 0; attempt < 18; attempt += 1) {
            try {
              health = await getJson('/health');
            } catch (error) {
              if (attempt === 17) throw error;
              await delay(5_000);
              continue;
            }
            assert.equal(health.evaluationMode, true, 'Public evaluation mode must be enabled.');
            if (health.foundryConnection?.connected) break;
            await delay(5_000);
          }
          assert.equal(health?.foundryEnabled, true, 'Foundry must be enabled in the App Service.');
          assert.equal(health?.foundryConnection?.connected, true, 'The managed-identity Foundry probe must connect.');
          assert.equal(health?.foundryConnection?.enabled, true, 'The Foundry connection must be enabled.');

          const status = await getJson('/api/security/status');
          assert.equal(status.evaluationMode, true);
          const products = await getJson('/api/products');
          assert.equal(products.origin, 'practice');
          assert.ok(Array.isArray(products.items));

          const probeResponse = await fetch(new URL('/api/foundry/check', baseUrl), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
          });
          assert.equal(probeResponse.status, 200, 'The public Foundry check should respond with HTTP 200.');
          const probe = await probeResponse.json();
          assert.equal(probe.connected, true, 'The live Foundry agent check must succeed.');
          console.log('Public demo and Microsoft Foundry connectivity verified.');
          NODE
